<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="geminiprocv-tech - Embedded Systems, IoT and Edge AI">
  <defs>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0d2b38" stroke-width="1"/>
    </pattern>
    <linearGradient id="fade" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#061218" stop-opacity="0"/>
      <stop offset="35%" stop-color="#061218" stop-opacity="0.72"/>
      <stop offset="100%" stop-color="#061218" stop-opacity="0.93"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8fd6ff" stop-opacity="0.34"/>
      <stop offset="100%" stop-color="#8fd6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="chipFace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123242"/>
      <stop offset="100%" stop-color="#0b2130"/>
    </linearGradient>
    <linearGradient id="nameGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#cdeeff"/>
      <stop offset="100%" stop-color="#8fd6ff"/>
    </linearGradient>
  </defs>

  <!-- background -->
  <rect width="1200" height="320" fill="#061218"/>
  <rect width="1200" height="320" fill="url(#grid)"/>
  <rect width="1200" height="320" fill="url(#fade)"/>

  <!-- traces -->
  <g stroke="#1e6f8f" stroke-width="2" fill="none" stroke-linecap="round">
    <path d="M0 268 H70 L96 242 H150"/>
    <path d="M0 292 H48 L72 268 H150"/>
    <path d="M150 242 V214"/>
    <path d="M1200 60 H1096 L1070 86 H1000"/>
    <path d="M1200 96 H1120 L1096 120 H1040"/>
    <path d="M1120 250 H1040 L1016 226 H956"/>
    <path d="M1200 286 H1064 L1040 262 H984"/>
  </g>

  <!-- solder pads -->
  <g fill="#8fd6ff">
    <circle cx="150" cy="242" r="3.5"/>
    <circle cx="150" cy="268" r="3.5"/>
    <circle cx="150" cy="214" r="3.5"/>
    <circle cx="1000" cy="86" r="3.5"/>
    <circle cx="1040" cy="120" r="3.5"/>
    <circle cx="956" cy="226" r="3.5"/>
    <circle cx="984" cy="262" r="3.5"/>
  </g>

  <!-- MCU chip -->
  <g transform="translate(60,96)">
    <g stroke="#2f8fb8" stroke-width="2">
      <path d="M-14 22 H0 M-14 44 H0 M-14 66 H0 M-14 88 H0"/>
      <path d="M120 22 H134 M120 44 H134 M120 66 H134 M120 88 H134"/>
      <path d="M22 -14 V0 M44 -14 V0 M66 -14 V0 M88 -14 V0"/>
      <path d="M22 120 V134 M44 120 V134 M66 120 V134 M88 120 V134"/>
    </g>
    <rect x="0" y="0" width="120" height="120" rx="10" fill="#081a24" stroke="#2f8fb8" stroke-width="2"/>
    <rect x="12" y="12" width="96" height="96" rx="6" fill="url(#chipFace)" stroke="#8fd6ff" stroke-width="1.4" opacity="0.95"/>
    <circle cx="24" cy="24" r="3" fill="#8fd6ff" opacity="0.85"/>
    <text x="60" y="58" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="17" font-weight="700" fill="#cdeeff" letter-spacing="1">CE</text>
    <text x="60" y="78" text-anchor="middle" font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace" font-size="9.5" fill="#8fd6ff" letter-spacing="1.5">MCU</text>
  </g>

  <!-- sensor node network -->
  <g>
    <circle cx="1010" cy="150" r="62" fill="url(#glow)"/>
    <g stroke="#2f8fb8" stroke-width="1.6" fill="none" opacity="0.85">
      <path d="M1010 150 L1104 104"/>
      <path d="M1010 150 L1092 206"/>
      <path d="M1010 150 L944 214"/>
      <path d="M1010 150 L948 96"/>
    </g>
    <circle cx="1010" cy="150" r="26" fill="#0b2130" stroke="#8fd6ff" stroke-width="2"/>
    <circle cx="1010" cy="150" r="10" fill="#8fd6ff" opacity="0.9"/>
    <circle cx="1010" cy="150" r="38" fill="none" stroke="#8fd6ff" stroke-width="1" opacity="0.3"/>
    <g fill="#0b2130" stroke="#8fd6ff" stroke-width="2">
      <circle cx="1104" cy="104" r="7"/>
      <circle cx="1092" cy="206" r="7"/>
      <circle cx="944" cy="214" r="7"/>
      <circle cx="948" cy="96" r="7"/>
    </g>
    <!-- wifi arcs -->
    <g stroke="#8fd6ff" fill="none" stroke-width="2" opacity="0.5" stroke-linecap="round">
      <path d="M1140 42 a34 34 0 0 1 34 34"/>
      <path d="M1148 26 a52 52 0 0 1 52 52"/>
    </g>
    <circle cx="1124" cy="58" r="3.5" fill="#8fd6ff" opacity="0.9"/>
  </g>

  <!-- name -->
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="230" y="146" font-size="46" font-weight="700" fill="url(#nameGrad)" letter-spacing="0.5">geminiprocv-tech</text>
    <text x="232" y="180" font-size="15" letter-spacing="1.2" fill="#8fd6ff">EMBEDDED SYSTEMS · IoT · EDGE AI</text>
    <text x="232" y="206" font-size="12.5" letter-spacing="0.6" fill="#7fa8bb">Computer Engineering · Hoi An / Da Nang, Vietnam</text>

    <!-- status pills -->
    <g font-size="11" letter-spacing="1">
      <rect x="232" y="228" width="122" height="26" rx="13" fill="#0b2130" stroke="#2f8fb8"/>
      <circle cx="250" cy="241" r="4" fill="#8fd6ff"/>
      <text x="262" y="245" fill="#bfe9ff">STATUS ONLINE</text>

      <rect x="366" y="228" width="130" height="26" rx="13" fill="#0b2130" stroke="#2f8fb8"/>
      <text x="380" y="245" fill="#bfe9ff">MODE: BUILDING</text>

      <rect x="508" y="228" width="118" height="26" rx="13" fill="#0b2130" stroke="#2f8fb8"/>
      <text x="522" y="245" fill="#bfe9ff">SIGNAL ▂▄▆█</text>
    </g>

    <!-- pinout strip -->
    <g font-size="9" letter-spacing="1" fill="#5e8a9e">
      <line x1="232" y1="288" x2="760" y2="288" stroke="#1e6f8f" stroke-width="1"/>
      <g stroke="#1e6f8f" stroke-width="1">
        <path d="M240 288 v-6 M320 288 v-6 M400 288 v-6 M480 288 v-6 M560 288 v-6 M640 288 v-6 M720 288 v-6"/>
      </g>
      <text x="240" y="302">VCC</text>
      <text x="318" y="302">GND</text>
      <text x="398" y="302">SDA</text>
      <text x="478" y="302">SCL</text>
      <text x="558" y="302">TX</text>
      <text x="638" y="302">RX</text>
      <text x="716" y="302">3V3</text>
    </g>
  </g>
</svg>
