    <linearGradient id="nameGrad2" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="70%" stop-color="#cdeeff"/>
      <stop offset="100%" stop-color="#8fd6ff"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="320" fill="#061218"/>
