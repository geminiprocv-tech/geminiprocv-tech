<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 320" width="1200" height="320" role="img" aria-label="geminiprocv-tech animated IoT banner">
  <defs>
    <pattern id="grid2" width="40" height="40" patternUnits="userSpaceOnUse">
      <path d="M40 0H0V40" fill="none" stroke="#0d2b38" stroke-width="1"/>
    </pattern>
    <radialGradient id="glow2" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%" stop-color="#8fd6ff" stop-opacity="0.4"/>
      <stop offset="100%" stop-color="#8fd6ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#8fd6ff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#8fd6ff" stop-opacity="0.14"/>
      <stop offset="100%" stop-color="#8fd6ff" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="chipFace2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#123242"/>
      <stop offset="100%" stop-color="#0b2130"/>
